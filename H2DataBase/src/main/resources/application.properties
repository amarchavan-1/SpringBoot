spring.application.name=H2DataBase

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Non-Persistent (In-Memory) H2 database ? data is stored in RAM and will be LOST when the application stops
#spring.datasource.url=jdbc:h2:mem:test

# Persistent (File-Based) H2 database ? data is stored on disk and will remain even after restarting the application
spring.datasource.url=jdbc:h2:file:~/h2database/test

spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true